name: dashboard

on:
  push:
    branches: [main]
    paths: [dashboard/**, .github/workflows/dashboard.yml]
  pull_request:
    paths: [dashboard/**, .github/workflows/dashboard.yml]
  workflow_dispatch:

concurrency:
  group: dashboard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pc-dash:latest dashboard

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read # GITHUB_TOKEN clones the repo on the VM
    concurrency:
      group: deploy-pc-dash # serialize deploys; never cancel one mid-flight
      cancel-in-progress: false
    steps:
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        env:
          MQTT_URI: ${{ secrets.MQTT_URI }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
          PC_CMD_SECRET: ${{ secrets.PC_CMD_SECRET }}
          REPO_CLONE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GIT_REF: ${{ github.sha }}
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: 22
          envs: MQTT_URI,MQTT_USER,MQTT_PASS,CF_ACCESS_TEAM_DOMAIN,CF_ACCESS_AUD,ALLOWED_EMAIL,PC_CMD_SECRET,REPO_CLONE_TOKEN,GH_REPO,GIT_REF
          script: |
            set -euo pipefail
            APP_DIR=/opt/pc-dash/app
            REPO_URL="https://x-access-token:${REPO_CLONE_TOKEN}@github.com/${GH_REPO}.git"

            # First run: clone. The VM already has Docker and the tunnel-gateway network.
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo rm -rf "$APP_DIR"
              sudo mkdir -p "$(dirname "$APP_DIR")"
              sudo git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            sudo git remote set-url origin "$REPO_URL"
            sudo git fetch origin "$GIT_REF"
            sudo git reset --hard FETCH_HEAD
            # Don't leave the token in .git/config
            sudo git remote set-url origin "https://github.com/${GH_REPO}.git"

            # .env is regenerated from GitHub Secrets (the source of truth) on every deploy
            sudo tee dashboard/.env > /dev/null <<EOF
            NODE_ENV=production
            PORT=8080
            MQTT_URI=${MQTT_URI}
            MQTT_USER=${MQTT_USER}
            MQTT_PASS=${MQTT_PASS}
            CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
            CF_ACCESS_AUD=${CF_ACCESS_AUD}
            ALLOWED_EMAIL=${ALLOWED_EMAIL}
            PC_CMD_SECRET=${PC_CMD_SECRET}
            EOF
            sudo chmod 600 dashboard/.env

            sudo docker compose -f dashboard/docker-compose.prod.yml --env-file dashboard/.env up -d --build
            sudo docker system prune -f
            echo "Deploy complete at $(date)"
